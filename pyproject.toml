[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingbot"
version = "0.2.0"
description = "Bot de trading algorítmico automatizado"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "ncifuentesi" }
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "tests",
]
pythonpath = [
    "."
]
