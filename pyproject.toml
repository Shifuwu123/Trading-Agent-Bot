[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingbot"
version = "0.2.0"
description = "Bot de trading algorítmico automatizado"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "ncifuentesi" }
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "tests",
]
pythonpath = [
    "."
]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "backups_db",
    "data",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",
    "E402",
    "E701",
    "E712", # SQLAlchemy requires == True for column expressions
    "E741", # Ambiguous variable name in local comprehensions
    "F401",
    "F841",
    "W293",
    "W291",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
exclude = [
    "^\\.venv/",
    "^backups_db/",
    "^data/"
]

