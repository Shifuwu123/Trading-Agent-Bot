# ============================================================
# SubAgent 3: ESPECULATIVO — Tier 3 (Anomalías / Alto Riesgo)
# Monedas: BEAMX, MUBARAK  ← PEPE EXCLUIDO (spread 0.23%)
# ⚠️ ADVERTENCIA: Capital mínimo. INICIA EN MODO PASSIVE.
# Decisión aplicada: Recomendación #2 (Escenario B) — Tier 3 en PASSIVE
#   hasta que el sistema principal esté validado en producción.
# Decisión aplicada: Recomendación #3 — Estado inicial PASSIVE
#   Control humano sobre activos manipulables por ballenas.
#   Activar con: /resume_speculative desde Telegram
# ============================================================
agent:
  name: "SpeculativeAgent_Tier3"
  agent_id: "speculative_t3"
  capital_pool_pct: 0.10           # 10% capital en Escenario A

bot:
  mode: "active"                   # ← ACTIVADO (Escenario A)
  trading_mode: "scalper"
  timeframe: "15m"                 # Velas largas para filtrar spikes falsos

  trading_pairs:
    - "BEAMX/USDT"
    - "MUBARAK/USDT"
    # PEPE/USDT EXCLUIDO: spread 0.23% destruye el margen del scalper

  dynamic_timeframe:
    enabled: false                 # Sin cambio dinámico — velas 15m siempre

  base_currency: "USDT"
  fiat_currency: "CLP"

risk:
  max_open_positions: 2
  max_capital_exposure_pct: 1.00
  reserve_capital_pct: 0.00
  coin_reserve_pct: 0.25
  max_coin_order_pct: 0.75
  max_loss_per_trade_pct: 0.02     # SL 2% rígido — crítico en este tier
  daily_loss_limit_pct: 0.04
  max_drawdown_pct: 0.10           # Halt global al 10% de caída del pool
  default_take_profit_pct: 0.06    # TP 6% (rangos >20% permiten capturar impulsos)
  trailing_stop: true
  trailing_stop_positive: 0.03
  min_order_usd: 0.10

  market_bias:
    enabled: true                   # BTC Bias: Solo comprar especulativas si BTC 1h >= EMA 50
    btc_symbol: "BTC/USDT"
    timeframe: "1h"
    ema_period: 50
    cache_ttl_seconds: 60

  micro_dca:
    enabled: true                   # Entrada en 2 tramos
    initial_tranche_pct: 0.5333
    pullback_tranche_pct: 0.4667
    pullback_min_pct: 0.010
    pullback_max_pct: 0.040

  profit_harvest:
    enabled: true
    threshold_pct: 1.00             # +100% ganancia en memes/anomalías
    threshold_usd: 15.00
    harvest_ratio: 1.00

strategies:
  active: "ema_crossover"
  ema_crossover:
    fast_period: 21
    slow_period: 55                # EMA más lenta para filtrar ruido especulativo
    signal_type: "ema"

# ============================================================
# INSTRUCCIONES DE ACTIVACIÓN:
# 1. Para activar operaciones: enviar /resume_speculative en Telegram
# 2. Para asignar capital: cambiar capital_pool_pct a 0.10
# 3. Migrar a Escenario A (con Tier3) después de 1 semana estable
# ============================================================
