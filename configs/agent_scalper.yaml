# ============================================================
# SubAgent 1: SCALPER — Tier 1 (Alta Volatilidad + Liquidez)
# Monedas: SUI, NEAR, SOL, DOGE (+ anclas de liquidez)
# Basado en: Informe Mercado Crypto - Sección 5.2
# Decisión aplicada: OPCIÓN A — Portafolio Equilibrado de Alto Rendimiento
#   Mayor resiliencia en mercados laterales al inicio (Recomendación #1)
# ============================================================
agent:
  name: "ScalperAgent_Tier1"
  agent_id: "scalper_t1"
  capital_pool_pct: 0.35           # 35% del capital total (5 Subagentes)

bot:
  mode: "active"
  trading_mode: "scalper"
  timeframe: "1m"

  # ----------------------------------------------------------
  # 🚀 OPCIÓN B (MIGRACIÓN ACTIVA): Cartera de Alta Volatilidad
  #    BNB/USDT y XRP/USDT retiradas y transferidas a SwingGridAgent.
  #    Incorporados activos de alta reactividad intradiaria.
  # ----------------------------------------------------------
  trading_pairs:
    - "NEAR/USDT"          # Pilar #1 rentabilidad (Win Rate 66.7%, PnL +$0.068 USD)
    - "SUI/USDT"           # Líder de momentum (rango ~8% diario, Win Rate 66.7%)
    - "SOL/USDT"           # Pilar de liquidez premium con spread mínimo
    - "DOGE/USDT"          # Alta volatilidad intradiaria y volumen constante
    - "ADA/USDT"           # Rendimiento probado (Win Rate 50%, PnL positivo)
    - "FET/USDT"           # Narrativa IA, rango diario 12-16%
    - "TAO/USDT"           # IA descentralizada, alta volatilidad intradiaria
    - "STRK/USDT"          # Layer 2 de alto beta con movimientos limpios
    - "WLD/USDT"           # Alta participación retail y fuerte fluctuación
    - "AVAX/USDT"          # Liquidez de gran capitalización con rango intradiario

  dynamic_timeframe:
    enabled: true
    active_hours_utc:
      start: 13
      end: 21
    active_timeframe: "1m"
    passive_timeframe: "5m"

  base_currency: "USDT"
  fiat_currency: "CLP"

risk:
  max_open_positions: 10
  max_capital_exposure_pct: 1.00
  reserve_capital_pct: 0.00
  coin_reserve_pct: 0.25
  max_coin_order_pct: 0.75
  max_loss_per_trade_pct: 0.02
  daily_loss_limit_pct: 0.05
  max_drawdown_pct: 0.15
  default_take_profit_pct: 0.04    # TP 4% alcanzable con SUI/NEAR en 1m-15m
  trailing_stop: true
  trailing_stop_positive: 0.02
  min_order_usd: 0.10

  time_stop:
    enabled: true
    min_duration_minutes: 120        # Seguro: 120 min de maduración antes de evaluar corte
    consecutive_cycles_required: 3   # Seguro: 3 minutos consecutivos cerrando en pérdida
    dead_zone_pct: 0.0030            # 0.30% tolerancia: No cerrar si PnL está entre 0.0% y -0.30%
    max_loss_pct: 0.02              # Salida acotada
    hard_stop_loss_pct: 0.045       # Hard Stop de emergencia absoluta (flash crash: -4.5%)
    oversold_grace_enabled: true

  market_bias:
    enabled: true                   # BTC Market Bias Filter: Solo compra si BTC 1h >= EMA 50
    btc_symbol: "BTC/USDT"
    timeframe: "1h"
    ema_period: 50
    cache_ttl_seconds: 60

  micro_dca:
    enabled: true                   # Entrada escalonada en 2 tramos
    initial_tranche_pct: 0.5333     # Tramo 1: ~$0.40 USD de $0.75 USD
    pullback_tranche_pct: 0.4667    # Tramo 2: ~$0.35 USD de $0.75 USD
    pullback_min_pct: 0.006         # Retroceso mínimo -0.6% hacia EMA 21
    pullback_max_pct: 0.025         # Retroceso máximo -2.5%

  profit_harvest:
    enabled: true
    threshold_pct: 1.00             # +100% de ganancia
    threshold_usd: 15.00            # o +$15.00 USD
    harvest_ratio: 1.00

  # Take Profit Institucional para Scalper (Supera comisiones de exchange)
  scalper_take_profit_pct: 0.015

  # Filtro Cuantitativo de Régimen de Mercado (Choppiness Index & ADX)
  regime_filter:
    enabled: true
    chop_max: 61.8
    adx_min: 22.0

strategies:
  active: "ema_crossover"
  ema_crossover:
    fast_period: 9
    slow_period: 21
    signal_type: "ema"
