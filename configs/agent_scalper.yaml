# ============================================================
# SubAgent 1: SCALPER — Tier 1 (Alta Volatilidad + Liquidez)
# Monedas: SUI, NEAR, SOL, DOGE (+ anclas de liquidez)
# Basado en: Informe Mercado Crypto - Sección 5.2
# Decisión aplicada: OPCIÓN A — Portafolio Equilibrado de Alto Rendimiento
#   Mayor resiliencia en mercados laterales al inicio (Recomendación #1)
# ============================================================
agent:
  name: "ScalperAgent_Tier1"
  agent_id: "scalper_t1"
  capital_pool_pct: 0.45           # 45% del capital total (Escenario A con Tier3)

bot:
  mode: "active"
  trading_mode: "scalper"
  timeframe: "1m"

  # ----------------------------------------------------------
  # ✅ OPCIÓN A (SELECCIONADA): Portafolio Equilibrado de Alto Rendimiento
  #    Mayor resiliencia en mercados laterales. Mezcla anclas de liquidez
  #    (SOL, BNB, XRP) con activos de momentum (SUI, NEAR, DOGE, FET).
  #    Recomendación del informe: empezar aquí antes de pasar a Opción B.
  # ----------------------------------------------------------
  trading_pairs:
    - "SOL/USDT"           # Pilar de liquidez — alta estabilidad
    - "BNB/USDT"           # Pilar de liquidez — señales limpias
    - "XRP/USDT"           # Pilar de liquidez — estabilidad
    - "SUI/USDT"           # Líder de momentum (rango ~8% diario)
    - "NEAR/USDT"          # Líder de momentum (rango ~7% diario)
    - "DOGE/USDT"          # Alta volatilidad + liquidez
    - "ADA/USDT"           # Ancla de Tier 2 con buena liquidez

  # ----------------------------------------------------------
  # 🚀 OPCIÓN B (comentada): Scalper Agresivo — activar tras 1 semana
  #    Win Rate > 55% en paper trading para migrar a esta configuración.
  # ----------------------------------------------------------
  # trading_pairs:
  #   - "SUI/USDT"
  #   - "NEAR/USDT"
  #   - "FET/USDT"
  #   - "STRK/USDT"
  #   - "TAO/USDT"
  #   - "WLD/USDT"
  #   - "DOGE/USDT"
  #   - "SOL/USDT"
  #   - "QNT/USDT"
  #   - "ADA/USDT"

  dynamic_timeframe:
    enabled: true
    active_hours_utc:
      start: 13
      end: 21
    active_timeframe: "1m"
    passive_timeframe: "5m"

  base_currency: "USDT"
  fiat_currency: "CLP"

risk:
  max_open_positions: 8
  max_capital_exposure_pct: 1.00
  reserve_capital_pct: 0.00
  coin_reserve_pct: 0.25
  max_coin_order_pct: 0.75
  max_loss_per_trade_pct: 0.02
  daily_loss_limit_pct: 0.05
  max_drawdown_pct: 0.15
  default_take_profit_pct: 0.04    # TP 4% alcanzable con SUI/NEAR en 1m-15m
  trailing_stop: true
  trailing_stop_positive: 0.02
  min_order_usd: 0.10

  time_stop:
    enabled: true
    min_duration_minutes: 120        # Seguro: 120 min de maduración antes de evaluar corte
    consecutive_cycles_required: 3   # Seguro: 3 minutos consecutivos cerrando en pérdida
    max_loss_pct: 0.02              # Salida acotada
    hard_stop_loss_pct: 0.045       # Hard Stop de emergencia absoluta (flash crash: -4.5%)
    oversold_grace_enabled: true

  market_bias:
    enabled: true                   # BTC Market Bias Filter: Solo compra si BTC 1h >= EMA 50
    btc_symbol: "BTC/USDT"
    timeframe: "1h"
    ema_period: 50
    cache_ttl_seconds: 60

  micro_dca:
    enabled: true                   # Entrada escalonada en 2 tramos
    initial_tranche_pct: 0.5333     # Tramo 1: ~$0.40 USD de $0.75 USD
    pullback_tranche_pct: 0.4667    # Tramo 2: ~$0.35 USD de $0.75 USD
    pullback_min_pct: 0.006         # Retroceso mínimo -0.6% hacia EMA 21
    pullback_max_pct: 0.025         # Retroceso máximo -2.5%

  profit_harvest:
    enabled: true
    threshold_pct: 1.00             # +100% de ganancia
    threshold_usd: 15.00            # o +$15.00 USD
    harvest_ratio: 1.00

strategies:
  active: "ema_crossover"
  ema_crossover:
    fast_period: 9
    slow_period: 21
    signal_type: "ema"
