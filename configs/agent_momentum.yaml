# ============================================================
# SubAgent 2: MOMENTUM — Tier 2 (AI, Capa 2, Retail)
# Monedas: FET, TAO, WLD, STRK, QNT
# Basado en: Informe Mercado Crypto - Sección 3 Tier 2
# Capital: 40% del total (Escenario B sin Tier3 — Recomendación #2)
# ============================================================
agent:
  name: "MomentumAgent_Tier2"
  agent_id: "momentum_t2"
  capital_pool_pct: 0.35           # 35% del capital total (Escenario A con Tier3)

bot:
  mode: "active"
  trading_mode: "target"           # Solo cierra en ganancias (volatilidad narrativa)
  timeframe: "5m"

  trading_pairs:
    - "FET/USDT"           # IA narrativa — rango diario ~15.8%
    - "TAO/USDT"           # IA descentralizada — alta volatilidad
    - "WLD/USDT"           # WorldCoin — narrativa fuerte
    - "STRK/USDT"          # StarkNet — Layer 2 — rango ~19.5%
    - "QNT/USDT"           # Quant — interoperabilidad

  dynamic_timeframe:
    enabled: true
    active_hours_utc:
      start: 12
      end: 22
    active_timeframe: "5m"
    passive_timeframe: "15m"

  base_currency: "USDT"
  fiat_currency: "CLP"

risk:
  max_open_positions: 5
  max_capital_exposure_pct: 1.00
  reserve_capital_pct: 0.00
  coin_reserve_pct: 0.25
  max_coin_order_pct: 0.75
  max_loss_per_trade_pct: 0.025    # SL ligeramente mayor por volatilidad narrativa
  daily_loss_limit_pct: 0.06
  max_drawdown_pct: 0.18
  default_take_profit_pct: 0.05    # TP 5% (STRK/FET tienen rangos de 15-20%)
  trailing_stop: true
  trailing_stop_positive: 0.025
  min_order_usd: 0.10

strategies:
  active: "ema_crossover"
  ema_crossover:
    fast_period: 9
    slow_period: 21
    signal_type: "ema"
